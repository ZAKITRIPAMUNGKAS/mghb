<svg
    width="100%"
    height="100%"
    xmlns="http://www.w3.org/2000/svg"
>
    <defs>
        <!-- BNI Parang Diagonal Pattern Unit -->
        <pattern
            id="batikPattern"
            width="110"
            height="110"
            patternUnits="userSpaceOnUse"
            patternTransform="rotate(-38)"
        >
            <g opacity="0.85">
                <!-- Badan parang putih -->
                <path
                    d="
                        M 8 -20
                        C 8 0, 30 0, 30 20
                        C 30 40, 8 40, 8 60
                        C 8 80, 30 80, 30 100
                        C 30 120, 8 120, 8 140
                    "
                    fill="none"
                    stroke="#FFFFFF"
                    stroke-width="8"
                    stroke-linecap="round"
                />

                <!-- Inner orange accent BNI -->
                <path
                    d="
                        M 8 -20
                        C 8 0, 30 0, 30 20
                        C 30 40, 8 40, 8 60
                        C 8 80, 30 80, 30 100
                        C 30 120, 8 120, 8 140
                    "
                    fill="none"
                    stroke="#F15A24"
                    stroke-width="2"
                    stroke-linecap="round"
                />

                <!-- Garis panjang -->
                <rect
                    x="54"
                    y="-10"
                    width="7"
                    height="72"
                    rx="4"
                    fill="#FFFFFF"
                />

                <!-- Titik ornamen -->
                <circle
                    cx="57.5"
                    cy="76"
                    r="4"
                    fill="#FFFFFF"
                />
            </g>
        </pattern>
    </defs>

    <rect
        width="100%"
        height="100%"
        fill="url(#batikPattern)"
    />
</svg>