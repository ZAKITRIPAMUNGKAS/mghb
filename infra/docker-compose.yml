version: '3.8'

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: laku_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: laku_transit
      POSTGRES_USER: laku_user
      POSTGRES_PASSWORD: laku_password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../packages/pipeline/src/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U laku_user -d laku_transit"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    container_name: laku_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # OpenTripPlanner 2 — Blue Instance
  otp-blue:
    image: opentripplanner/opentripplanner:2.5.0
    container_name: laku_otp_blue
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./otp:/var/opentripplanner
    command: ["--load", "--serve", "/var/opentripplanner"]
    environment:
      - JAVA_OPTS=-Xmx4G -Xms2G
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/otp/actuators/health | grep UP || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  # OpenTripPlanner 2 — Green Instance (for Blue/Green swap)
  otp-green:
    image: opentripplanner/opentripplanner:2.5.0
    container_name: laku_otp_green
    restart: unless-stopped
    profiles:
      - bg-deploy
    ports:
      - "8081:8080"
    volumes:
      - ./otp:/var/opentripplanner
    command: ["--load", "--serve", "/var/opentripplanner"]
    environment:
      - JAVA_OPTS=-Xmx4G -Xms2G

volumes:
  postgres-data:
  redis-data:
