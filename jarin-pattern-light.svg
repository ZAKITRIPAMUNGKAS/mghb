<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <pattern id="batik" x="0" y="0" width="128" height="128" patternUnits="userSpaceOnUse">
      <rect width="128" height="128" fill="#F8FAFC" />

      <!-- kawung grid -->
      <circle cx="32" cy="64" r="32" fill="none" stroke="#005E6A" stroke-width="0.6" opacity="0.18" />
      <circle cx="96" cy="64" r="32" fill="none" stroke="#005E6A" stroke-width="0.6" opacity="0.18" />
      <circle cx="64" cy="32" r="32" fill="none" stroke="#005E6A" stroke-width="0.6" opacity="0.18" />
      <circle cx="64" cy="96" r="32" fill="none" stroke="#005E6A" stroke-width="0.6" opacity="0.18" />

      <!-- ceplok diamonds -->
      <rect x="48" y="16" width="32" height="32" fill="none" stroke="#007C89" stroke-width="0.5" opacity="0.25" transform="rotate(45 64 32)" />
      <rect x="48" y="80" width="32" height="32" fill="none" stroke="#007C89" stroke-width="0.5" opacity="0.25" transform="rotate(45 64 96)" />
      <rect x="16" y="48" width="32" height="32" fill="none" stroke="#007C89" stroke-width="0.5" opacity="0.25" transform="rotate(45 32 64)" />
      <rect x="80" y="48" width="32" height="32" fill="none" stroke="#007C89" stroke-width="0.5" opacity="0.25" transform="rotate(45 96 64)" />

      <!-- center dot -->
      <circle cx="64" cy="32" r="2.5" fill="#007C89" opacity="0.2" />
      <circle cx="64" cy="96" r="2.5" fill="#007C89" opacity="0.2" />
      <circle cx="32" cy="64" r="2.5" fill="#007C89" opacity="0.2" />
      <circle cx="96" cy="64" r="2.5" fill="#007C89" opacity="0.2" />

      <!-- parang zigzag -->
      <polyline points="0,32 16,16 32,32 48,16 64,32 80,16 96,32 112,16 128,32" fill="none" stroke="#005E6A" stroke-width="0.7" opacity="0.12" stroke-linecap="round" stroke-linejoin="round" />
      <polyline points="0,96 16,80 32,96 48,80 64,96 80,80 96,96 112,80 128,96" fill="none" stroke="#005E6A" stroke-width="0.7" opacity="0.12" stroke-linecap="round" stroke-linejoin="round" />

      <!-- JARIN node clusters -->
      <circle cx="20" cy="20" r="1.8" fill="#007C89" opacity="0.3" /><circle cx="36" cy="12" r="1.4" fill="#5CE1E6" opacity="0.25" /><line x1="20" y1="20" x2="36" y2="12" stroke="#5CE1E6" stroke-width="0.4" opacity="0.15" stroke-dasharray="2 2" />
      <circle cx="108" cy="108" r="1.8" fill="#007C89" opacity="0.3" /><circle cx="92" cy="116" r="1.4" fill="#5CE1E6" opacity="0.25" /><line x1="108" y1="108" x2="92" y2="116" stroke="#5CE1E6" stroke-width="0.4" opacity="0.15" stroke-dasharray="2 2" />
      <circle cx="8" cy="80" r="1.8" fill="#007C89" opacity="0.3" /><circle cx="20" cy="72" r="1.4" fill="#5CE1E6" opacity="0.25" /><line x1="8" y1="80" x2="20" y2="72" stroke="#5CE1E6" stroke-width="0.4" opacity="0.15" stroke-dasharray="2 2" />
      <circle cx="120" cy="48" r="1.8" fill="#007C89" opacity="0.3" /><circle cx="108" cy="56" r="1.4" fill="#5CE1E6" opacity="0.25" /><line x1="120" y1="48" x2="108" y2="56" stroke="#5CE1E6" stroke-width="0.4" opacity="0.15" stroke-dasharray="2 2" />

      <!-- orange accent dots -->
      <circle cx="52" cy="52" r="0.4" fill="#F15A24" opacity="0.15" />
      <circle cx="76" cy="76" r="0.4" fill="#F15A24" opacity="0.15" />
      <circle cx="100" cy="28" r="0.4" fill="#F15A24" opacity="0.15" />
      <circle cx="28" cy="100" r="0.4" fill="#F15A24" opacity="0.15" />

      <!-- sawat curves -->
      <path d="M 56,8 Q 64,16 72,8" fill="none" stroke="#007C89" stroke-width="0.4" opacity="0.12" />
      <path d="M 56,120 Q 64,112 72,120" fill="none" stroke="#007C89" stroke-width="0.4" opacity="0.12" />
      <path d="M 8,56 Q 16,64 8,72" fill="none" stroke="#007C89" stroke-width="0.4" opacity="0.12" />
      <path d="M 120,56 Q 112,64 120,72" fill="none" stroke="#007C89" stroke-width="0.4" opacity="0.12" />
    </pattern>
  </defs>
  <rect width="128" height="128" fill="url(#batik)" />
</svg>