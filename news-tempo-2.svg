<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EFF6FF"/>
      <stop offset="60%" stop-color="#DBEAFE"/>
      <stop offset="100%" stop-color="#93C5FD" stop-opacity="0.9"/>
    </linearGradient>
    <pattern id="newsprint" width="12" height="12" patternTransform="rotate(0 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="3" x2="12" y2="3" stroke="#1E3A8A" stroke-width="0.6" stroke-opacity="0.12"/>
      <line x1="0" y1="7" x2="12" y2="7" stroke="#1E3A8A" stroke-width="0.6" stroke-opacity="0.12"/>
      <line x1="0" y1="11" x2="12" y2="11" stroke="#1E3A8A" stroke-width="0.6" stroke-opacity="0.12"/>
    </pattern>
    <linearGradient id="stampGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#991B1B"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="640" height="360" fill="url(#bg2)"/>
  <rect width="640" height="360" fill="url(#newsprint)"/>

  <!-- Giant Newspaper / Harian Tempo Style Folded Background -->
  <g transform="translate(100, 30) rotate(-4)">
    <!-- Paper Shadow -->
    <rect x="8" y="8" width="440" height="280" rx="6" fill="#0F172A" opacity="0.18"/>
    <!-- Paper Sheet -->
    <rect x="0" y="0" width="440" height="280" rx="6" fill="#FFFDF7" stroke="#0F172A" stroke-width="3"/>
    
    <!-- Masthead / Newspaper Header -->
    <rect x="20" y="16" width="400" height="38" fill="#1E293B"/>
    <text x="220" y="38" font-family="Georgia, serif" font-weight="900" font-size="18" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">KABAR KEMNAKER</text>
    <text x="220" y="48" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="7" fill="#FDE68A" text-anchor="middle" letter-spacing="1.5">EDISI KHUSUS · PROGRAM PEMAGANGAN NASIONAL 2026</text>
    <line x1="20" y1="58" x2="420" y2="58" stroke="#0F172A" stroke-width="2"/>

    <!-- Headline Big Banner -->
    <text x="30" y="82" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="20" fill="#0F172A" letter-spacing="-0.5">70.000 KUOTA RESMI DIBUKA!</text>
    <text x="30" y="98" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="9" fill="#007C89">SELEKSI KELULUSAN BATCH II ANGKATAN II DIUMUMKAN SERENTAK</text>
    <line x1="20" y1="106" x2="420" y2="106" stroke="#E2E8F0" stroke-width="1.5"/>

    <!-- Multi-Column Text Simulation (Tempo Editorial Layout) -->
    <g fill="#64748B" opacity="0.8">
      <!-- Column 1 -->
      <rect x="25" y="115" width="120" height="4" rx="1"/>
      <rect x="25" y="123" width="115" height="4" rx="1"/>
      <rect x="25" y="131" width="122" height="4" rx="1"/>
      <rect x="25" y="139" width="110" height="4" rx="1"/>
      <rect x="25" y="147" width="118" height="4" rx="1"/>
      <rect x="25" y="155" width="105" height="4" rx="1"/>
      <rect x="25" y="163" width="120" height="4" rx="1"/>
      <rect x="25" y="171" width="112" height="4" rx="1"/>

      <!-- Column 2 (Middle) -->
      <rect x="160" y="115" width="120" height="4" rx="1"/>
      <rect x="160" y="123" width="118" height="4" rx="1"/>
      <rect x="160" y="131" width="112" height="4" rx="1"/>
      <rect x="160" y="139" width="122" height="4" rx="1"/>
      <rect x="160" y="147" width="115" height="4" rx="1"/>
      <rect x="160" y="155" width="119" height="4" rx="1"/>
      <rect x="160" y="163" width="108" height="4" rx="1"/>
      <rect x="160" y="171" width="116" height="4" rx="1"/>
    </g>

    <!-- Photo Placeholder inside newspaper -->
    <rect x="295" y="115" width="120" height="85" fill="#E2E8F0" stroke="#0F172A" stroke-width="1.8"/>
    <!-- Illustration of hands shaking inside newspaper photo -->
    <circle cx="355" cy="145" r="18" fill="#FDBA74" stroke="#0F172A" stroke-width="1.5"/>
    <path d="M 335 175 C 340 160 370 160 375 175 Z" fill="#007C89" stroke="#0F172A" stroke-width="1.5"/>
    <text x="355" y="193" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="6" fill="#64748B" text-anchor="middle">MITRA INDUSTRI NASIONAL</text>

    <!-- Stempel "DITERIMA / LOLOS SELEKSI" (Tempo Editorial Caricature Stamp) -->
    <g transform="translate(195, 140) rotate(-14)">
      <rect x="0" y="0" width="165" height="60" rx="8" fill="#FEF2F2" fill-opacity="0.9" stroke="url(#stampGrad)" stroke-width="4.5" stroke-dasharray="14 4"/>
      <rect x="5" y="5" width="155" height="50" rx="5" fill="none" stroke="#DC2626" stroke-width="1.5"/>
      <text x="82" y="28" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="16" fill="#DC2626" text-anchor="middle" letter-spacing="2">DITERIMA!</text>
      <text x="82" y="44" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="8.5" fill="#B91C1C" text-anchor="middle" letter-spacing="1">MAGANGHUB KEMNAKER</text>
    </g>
  </g>

  <!-- Celebratory Confetti & Editorial Pen/Megaphone (Foreground) -->
  <!-- Digital Megaphone (Pengumuman) -->
  <g transform="translate(35, 180) rotate(15)">
    <polygon points="0,20 65,0 65,55 0,35" fill="#F15A24" stroke="#0F172A" stroke-width="3"/>
    <ellipse cx="65" cy="27" rx="9" ry="27" fill="#E05315" stroke="#0F172A" stroke-width="3"/>
    <rect x="-18" y="22" width="22" height="12" rx="3" fill="#1E293B" stroke="#0F172A" stroke-width="2.5"/>
    <!-- Handle -->
    <path d="M 20 33 L 15 62 L 30 62 L 32 30" fill="#CBD5E1" stroke="#0F172A" stroke-width="2.5"/>
    <!-- Sound Waves / Speed lines -->
    <path d="M 80 10 Q 100 27 80 45" fill="none" stroke="#F15A24" stroke-width="3" stroke-linecap="round"/>
    <path d="M 92 0 Q 120 27 92 55" fill="none" stroke="#007C89" stroke-width="3.5" stroke-linecap="round"/>
  </g>

  <!-- Editorial Stars & Sparkles -->
  <polygon points="560,50 564,62 576,64 567,73 570,85 560,78 549,85 552,73 543,64 555,62" fill="#FBBF24" stroke="#0F172A" stroke-width="2"/>
  <polygon points="70,70 73,78 82,80 75,86 77,95 70,90 62,95 64,86 58,80 67,78" fill="#F59E0B" stroke="#0F172A" stroke-width="1.8"/>
  <polygon points="580,240 582,246 589,247 584,252 585,258 580,255 574,258 576,252 571,247 577,246" fill="#F15A24" stroke="#0F172A" stroke-width="1.5"/>

  <!-- Caption Strip ala Tempo -->
  <rect x="25" y="327" width="230" height="24" rx="3" fill="#0F172A"/>
  <text x="140" y="343" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="9" fill="#93C5FD" text-anchor="middle" letter-spacing="0.5">PENGUMUMAN &amp; SELEKSI NASIONAL</text>
</svg>
