<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
  <meta name="theme-color" content="#005BAC">
  <title>Laku — Perencana Perjalanan Multimoda Transit Jabodetabek</title>
  <meta name="description" content="Perencana perjalanan multimoda Jabodetabek: TransJakarta, Mikrotrans, KRL Commuter Line, MRT Jakarta, LRT Jakarta, dan LRT Jabodebek dalam satu pencarian rute terpadu.">
  <link rel="icon" type="image/png" href="faviconmghb.png">
  <link rel="shortcut icon" href="favicon.ico">
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <style>
    :root {
      --font-sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --bg-canvas: #F8FAFC;
      --bg-surface: #FFFFFF;
      --bg-subtle: #F1F5F9;
      --text-primary: #0F172A;
      --text-secondary: #475569;
      --text-muted: #64748B;
      --border-subtle: #E2E8F0;
      --border-strong: #CBD5E1;
      
      --primary: #005BAC;
      --primary-hover: #004B8C;
      --primary-subtle: #EEF5FF;

      --color-krl: #D32F2F;
      --color-mrt: #004B87;
      --color-lrt: #0284C7;
      --color-lrtj: #DC2626;
      --color-brt: #DC2626;
      --color-mikrotrans: #0D9488;

      --radius-sm: 4px;
      --radius-md: 8px;
      --radius-lg: 14px;
      --shadow-panel: 0 4px 24px rgba(15, 23, 42, 0.12);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0; padding: 0;
    }

    body {
      font-family: var(--font-sans);
      background-color: var(--bg-canvas);
      color: var(--text-primary);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }

    #app-container {
      height: 100%;
      width: 100%;
      position: relative;
      display: flex;
    }

    #transit-map {
      position: absolute;
      inset: 0;
      z-index: 1;
    }

    /* ═══════════ DESKTOP WORKSPACE (400px Side Panel) ═══════════ */
    @media (min-width: 769px) {
      .app-sidebar {
        position: relative;
        z-index: 1000;
        width: 400px;
        height: 100vh;
        background: var(--bg-surface);
        border-right: 1px solid var(--border-subtle);
        box-shadow: var(--shadow-panel);
        display: flex;
        flex-direction: column;
      }
      .sheet-handle { display: none; }
    }

    /* ═══════════ MOBILE BOTTOM SHEET (3 States: Collapsed, Half, Full) ═══════════ */
    @media (max-width: 768px) {
      .app-sidebar {
        position: absolute;
        bottom: 0; left: 0; right: 0;
        z-index: 1000;
        background: var(--bg-surface);
        border-top: 1px solid var(--border-subtle);
        border-radius: var(--radius-lg) var(--radius-lg) 0 0;
        box-shadow: var(--shadow-panel);
        display: flex;
        flex-direction: column;
        transition: height 0.28s cubic-bezier(0.16, 1, 0.3, 1);
      }
      .app-sidebar.state-collapsed { height: 112px; }
      .app-sidebar.state-half { height: 50vh; }
      .app-sidebar.state-full { height: 92vh; }

      .sheet-handle {
        width: 40px; height: 5px;
        background: var(--border-strong);
        border-radius: 3px;
        margin: 8px auto 4px;
        cursor: grab;
      }
    }

    /* App Header */
    .panel-header {
      padding: 14px 18px 12px;
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bg-surface);
    }
    .brand-badge {
      display: flex;
      align-items: baseline;
      gap: 8px;
    }
    .brand-badge h1 {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.6px;
      color: var(--primary);
    }
    .brand-badge span {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .pill-status {
      font-size: 11px;
      background: #DCFCE7;
      color: #166534;
      padding: 2px 8px;
      border-radius: 12px;
      font-weight: 700;
    }

    /* Panel Body */
    .panel-body {
      flex: 1;
      overflow-y: auto;
      padding: 14px 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* Mode Filter Bar */
    .mode-pills {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 2px;
      scrollbar-width: none;
    }
    .mode-pills::-webkit-scrollbar { display: none; }
    .pill-btn {
      padding: 6px 12px;
      border-radius: 20px;
      border: 1px solid var(--border-subtle);
      background: var(--bg-surface);
      font-size: 11.5px;
      font-weight: 700;
      font-family: inherit;
      color: var(--text-secondary);
      cursor: pointer;
      white-space: nowrap;
      min-height: 34px;
      display: flex;
      align-items: center;
      transition: all 0.15s ease;
    }
    .pill-btn.active {
      background: var(--primary);
      border-color: var(--primary);
      color: #FFFFFF;
    }

    .preset-chips {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding: 2px 0 4px;
      scrollbar-width: none;
    }
    .preset-chips::-webkit-scrollbar { display: none; }
    .preset-btn {
      padding: 4px 10px;
      background: var(--bg-subtle);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      font-size: 11px;
      font-weight: 700;
      color: var(--text-secondary);
      cursor: pointer;
      white-space: nowrap;
      font-family: inherit;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: all 0.15s ease;
    }
    .preset-btn:hover {
      background: var(--primary-subtle);
      border-color: var(--primary);
      color: var(--primary);
    }

    /* Search Box */
    .search-box {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .input-row {
      position: relative;
      display: flex;
      align-items: center;
    }
    .input-dot {
      position: absolute;
      left: 14px;
      width: 10px; height: 10px;
      border-radius: 50%;
      z-index: 2;
    }
    .input-dot.origin { background: var(--primary); }
    .input-dot.destination { background: #DC2626; border-radius: 2px; }

    .search-input {
      width: 100%;
      height: 44px;
      padding: 0 36px 0 36px;
      font-size: 13.5px;
      font-family: inherit;
      color: var(--text-primary);
      background: var(--bg-subtle);
      border: 1.5px solid var(--border-subtle);
      border-radius: var(--radius-md);
      outline: none;
      transition: border-color 0.15s ease, background 0.15s ease;
    }
    .search-input:focus {
      border-color: var(--primary);
      background: #FFFFFF;
    }
    .clear-btn {
      position: absolute;
      right: 6px;
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 8px;
      font-size: 16px;
      min-width: 44px; min-height: 44px;
      display: flex; align-items: center; justify-content: center;
    }

    /* Suggestions Dropdown */
    .suggestions-dropdown {
      background: #FFFFFF;
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      max-height: 180px;
      overflow-y: auto;
      box-shadow: 0 4px 16px rgba(15, 23, 42, 0.08);
    }
    .sugg-item {
      padding: 9px 12px;
      font-size: 13px;
      cursor: pointer;
      border-bottom: 1px solid #F1F5F9;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .sugg-item:hover { background: #F8FAFC; }
    .sugg-badge {
      font-size: 10px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      color: #FFFFFF;
      text-transform: uppercase;
    }

    /* Search Action Controls */
    .search-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
    }
    .link-action {
      background: none;
      border: none;
      color: var(--primary);
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      min-height: 44px;
      font-family: inherit;
    }
    .btn-swap {
      background: #F1F5F9;
      border: 1px solid var(--border-subtle);
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      padding: 6px 10px;
      min-height: 44px;
      font-family: inherit;
    }

    .btn-submit {
      height: 46px;
      background: var(--primary);
      color: #FFFFFF;
      border: none;
      border-radius: var(--radius-md);
      font-size: 14px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.15s ease;
    }
    .btn-submit:hover { background: var(--primary-hover); }

    /* Itinerary Results */
    .itin-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 4px;
    }
    .itin-card {
      border: 1.5px solid var(--border-subtle);
      border-radius: var(--radius-md);
      background: var(--bg-surface);
      padding: 14px;
      cursor: pointer;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    .itin-card:hover, .itin-card.active {
      border-color: var(--primary);
      box-shadow: 0 4px 14px rgba(0, 91, 172, 0.12);
    }
    .itin-row-main {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 6px;
    }
    .itin-dur {
      font-size: 19px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    .itin-price {
      font-size: 14px;
      font-weight: 700;
      color: #047857;
    }
    .itin-tags {
      font-size: 11.5px;
      color: var(--text-muted);
      display: flex;
      gap: 10px;
      margin-bottom: 10px;
    }
    .itin-strip {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    .strip-badge {
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 700;
      color: #FFFFFF;
    }

    /* Timeline */
    .timeline {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--border-subtle);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .tl-step {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      font-size: 12.5px;
    }
    .tl-content {
      flex: 1;
    }
    .tl-sub {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    /* Footer */
    .panel-footer {
      padding: 10px 18px;
      border-top: 1px solid var(--border-subtle);
      font-size: 11px;
      color: var(--text-muted);
      background: var(--bg-subtle);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
  </style>
</head>
<body>

<div id="app-container">
  <!-- Interactive Leaflet Map -->
  <div id="transit-map"></div>

  <!-- Left Sidebar / Mobile Bottom Sheet -->
  <aside id="app-panel" class="app-sidebar state-half">
    <div class="sheet-handle" onclick="toggleSheet()"></div>

    <header class="panel-header">
      <div class="brand-badge">
        <h1>LAKU</h1>
        <span>Transit Jabodetabek</span>
      </div>
      <div class="pill-status">GTFS Resmi</div>
    </header>

    <div class="panel-body">
      <!-- Mode Filter Bar -->
      <div class="mode-pills">
        <button class="pill-btn active" onclick="setModeFilter('all', this)">Semua Moda</button>
        <button class="pill-btn" onclick="setModeFilter('bni', this)" style="border-color:#005E6A;color:#005E6A;">🏢 Jaringan BNI</button>
        <button class="pill-btn" onclick="setModeFilter('krl', this)">🚆 KRL</button>
        <button class="pill-btn" onclick="setModeFilter('mrt', this)">🚇 MRT</button>
        <button class="pill-btn" onclick="setModeFilter('lrt', this)">🚊 LRT</button>
        <button class="pill-btn" onclick="setModeFilter('brt', this)">🚌 TransJakarta</button>
        <button class="pill-btn" onclick="setModeFilter('mikrotrans', this)">🚐 Mikrotrans (Rp0)</button>
      </div>

      <!-- Fast Destination Presets (BNI & Transit Hubs) -->
      <div class="preset-chips">
        <span style="font-size:11px;font-weight:700;color:var(--text-muted);display:flex;align-items:center;white-space:nowrap;">Pintasan:</span>
        <button type="button" class="preset-btn" onclick="setDestinationPreset('bni:HO')" style="color:#005E6A;border-color:#005E6A;background:#E6F4F5;">🏢 Menara BNI</button>
        <button type="button" class="preset-btn" onclick="setDestinationPreset('krl:PLM')">🚆 Palmerah</button>
        <button type="button" class="preset-btn" onclick="setDestinationPreset('mrt:DKA')">🚇 Dukuh Atas BNI</button>
        <button type="button" class="preset-btn" onclick="setDestinationPreset('krl:SUDB')">🏛️ BNI City</button>
        <button type="button" class="preset-btn" onclick="setDestinationPreset('bni:JKT')">🏢 KC Jakarta Kota</button>
        <button type="button" class="preset-btn" onclick="setDestinationPreset('mrt:BLM')">🚌 Blok M</button>
      </div>

      <!-- Search Inputs -->
      <div class="search-box">
        <div class="input-row">
          <span class="input-dot origin"></span>
          <input id="p-from-input" class="search-input" placeholder="Asal (ketik stasiun/halte atau klik peta)" autocomplete="off">
          <button id="p-from-clear" class="clear-btn" style="display:none;" onclick="clearInput(true)">×</button>
        </div>
        <div id="p-from-dropdown" class="suggestions-dropdown" style="display:none;"></div>

        <div class="input-row">
          <span class="input-dot destination"></span>
          <input id="p-to-input" class="search-input" placeholder="Tujuan (ketik stasiun/halte atau klik peta)" autocomplete="off">
          <button id="p-to-clear" class="clear-btn" style="display:none;" onclick="clearInput(false)">×</button>
        </div>
        <div id="p-to-dropdown" class="suggestions-dropdown" style="display:none;"></div>

        <div class="search-actions">
          <button class="link-action" onclick="useCurrentLocation()">📍 Lokasi Saya (GPS)</button>
          <button class="btn-swap" onclick="swapEndpoints()">⇅ Tukar Asal &amp; Tujuan</button>
        </div>

        <button class="btn-submit" onclick="executePlan()">Cari Rute Multimoda</button>
      </div>

      <!-- Itinerary Results Container -->
      <div id="itineraries-container" class="itin-container"></div>
    </div>

    <footer class="panel-footer">
      <span>Data per 13 Okt 2026 (PPID &amp; Sync Resmi)</span>
      <span style="font-weight:600;">KAI · MRT · LRT · TJ</span>
    </footer>
  </aside>
</div>

  // Multi-Modal Routing Engine (Backend API + Client Solver Fallback)
  window.executePlan = function() {
    if (!fromCoord || !toCoord) {
      alert('Silakan tentukan titik awal dan tujuan (ketik nama halte atau klik langsung pada peta).');
      return;
    }

    var container = document.getElementById('itineraries-container');
    container.innerHTML = '<div style="padding:16px;text-align:center;font-size:13px;color:#64748B;"><div style="display:inline-block;width:18px;height:18px;border:2.5px solid #CBD5E1;border-top-color:#005BAC;border-radius:50%;animation:spin .6s linear infinite;margin-bottom:6px;"></div><br>Menghubungkan jaringan KRL, MRT, LRT, TransJakarta, dan Mikrotrans...</div>';

    // Expand mobile sheet to half
    var panel = document.getElementById('app-panel');
    if (panel && window.innerWidth <= 768) {
      panel.className = 'app-sidebar state-half';
    }

    var didLoadApi = false;
    var apiUrl = '/plan?from=' + fromCoord[0] + ',' + fromCoord[1] + '&to=' + toCoord[0] + ',' + toCoord[1];

    var controller = typeof AbortController !== 'undefined' ? new AbortController() : null;
    var timer = setTimeout(function() {
      if (controller) controller.abort();
      if (!didLoadApi) {
        var itineraries = computeMultiModalJourneys(fromCoord, toCoord);
        renderItineraries(itineraries);
      }
    }, 1200);

    fetch(apiUrl, controller ? { signal: controller.signal } : {})
      .then(function(r) { return r.ok ? r.json() : null; })
      .then(function(json) {
        if (json && json.itineraries && json.itineraries.length > 0) {
          didLoadApi = true;
          clearTimeout(timer);
          var mappedItins = json.itineraries.map(function(itin) {
            var legs = (itin.legs || []).map(function(leg) {
              return {
                type: leg.type,
                mode: leg.mode || 'brt',
                color: leg.route_color || '#005BAC',
                name: (leg.route_short_name ? leg.route_short_name + ' ' : '') + (leg.route_long_name || ''),
                from: leg.from_stop_name,
                to: leg.to_stop_name,
                duration: Math.round(leg.duration_seconds / 60),
                desc: leg.description
              };
            });
            return {
              duration_minutes: Math.round(itin.duration_seconds / 60),
              walking_distance: itin.walking_distance_meters,
              transfers: itin.transfers,
              estimated_fare: itin.estimated_fare_idr,
              departure_time: itin.departure_time || '07:30',
              arrival_time: itin.arrival_time || '08:15',
              legs: legs,
              pathCoords: [fromCoord, toCoord]
            };
          });
          renderItineraries(mappedItins);
        }
      })
      .catch(function() {
        if (!didLoadApi) {
          clearTimeout(timer);
          var itineraries = computeMultiModalJourneys(fromCoord, toCoord);
          renderItineraries(itineraries);
        }
      });
  };

  function haversineM(lat1, lon1, lat2, lon2) {
    var R = 6371000;
    var dLat = (lat2 - lat1) * Math.PI / 180;
    var dLon = (lon2 - lon1) * Math.PI / 180;
    var a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
            Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
            Math.sin(dLon / 2) * Math.sin(dLon / 2);
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
  }

  function computeMultiModalJourneys(fCoord, tCoord) {
    var cOrigins = [];
    var cDests = [];

    STATIONS_MASTER.forEach(function(s) {
      var d1 = haversineM(fCoord[0], fCoord[1], s.lat, s.lon);
      var d2 = haversineM(tCoord[0], tCoord[1], s.lat, s.lon);
      cOrigins.push({ station: s, dist: d1 });
      cDests.push({ station: s, dist: d2 });
    });

    cOrigins.sort(function(a, b) { return a.dist - b.dist; });
    cDests.sort(function(a, b) { return a.dist - b.dist; });

    var bestO = cOrigins[0];
    var bestD = cDests[0];

    var results = [];

    // Opsi 1: Direct / Primary Transit
    var walk1 = Math.round(bestO.dist);
    var walk2 = Math.round(bestD.dist);
    var transitDistM = haversineM(bestO.station.lat, bestO.station.lon, bestD.station.lat, bestD.station.lon);
    var transitMin = Math.max(12, Math.round(transitDistM / 420));
    var totalMin = Math.round((walk1 + walk2) / 75 + transitMin);

    var fare = 3500;
    if (bestO.station.mode === 'krl') fare = 4000;
    else if (bestO.station.mode === 'mrt') fare = 8000;
    else if (bestO.station.mode === 'lrt') fare = 5000;
    else if (bestO.station.mode === 'mikrotrans') fare = 0;

    results.push({
      duration_minutes: totalMin,
      walking_distance: walk1 + walk2,
      transfers: 0,
      estimated_fare: fare,
      departure_time: '07:15',
      arrival_time: '07:' + (15 + totalMin),
      legs: [
        { type: 'WALK', desc: 'Jalan kaki ' + walk1 + 'm ke ' + bestO.station.name, duration: Math.round(walk1 / 75) },
        {
          type: 'TRANSIT',
          mode: bestO.station.mode,
          color: bestO.station.color,
          name: bestO.station.line,
          from: bestO.station.name,
          to: bestD.station.name,
          duration: transitMin,
          desc: 'Naik ' + bestO.station.line + ' menuju ' + bestD.station.name
        },
        { type: 'WALK', desc: 'Jalan kaki ' + walk2 + 'm ke titik tujuan', duration: Math.round(walk2 / 75) }
      ],
      pathCoords: [fCoord, [bestO.station.lat, bestO.station.lon], [bestD.station.lat, bestD.station.lon], tCoord]
    });

    // Opsi 2: Transit Hub Transfer (via Dukuh Atas Hub)
    if (transitDistM > 4000) {
      var hub = STATIONS_MASTER.find(function(s) { return s.id === 'mrt:DKA'; }) || bestO.station;
      var t1 = Math.round(transitMin * 0.45);
      var t2 = Math.round(transitMin * 0.55);
      var totalMinHub = Math.round((walk1 + walk2) / 75 + t1 + 4 + t2);

      results.push({
        duration_minutes: totalMinHub,
        walking_distance: walk1 + walk2 + 120,
        transfers: 1,
        estimated_fare: 7500,
        departure_time: '07:10',
        arrival_time: '07:' + (10 + totalMinHub),
        legs: [
          { type: 'WALK', desc: 'Jalan kaki ke ' + bestO.station.name, duration: Math.round(walk1 / 75) },
          {
            type: 'TRANSIT',
            mode: bestO.station.mode,
            color: bestO.station.color,
            name: bestO.station.line,
            from: bestO.station.name,
            to: hub.name,
            duration: t1,
            desc: 'Naik ' + bestO.station.line + ' ke ' + hub.name
          },
          { type: 'WALK', desc: 'Transfer antarmoda di ' + hub.name + ' (120m)', duration: 4 },
          {
            type: 'TRANSIT',
            mode: bestD.station.mode,
            color: bestD.station.color,
            name: bestD.station.line,
            from: hub.name,
            to: bestD.station.name,
            duration: t2,
            desc: 'Naik ' + bestD.station.line + ' ke ' + bestD.station.name
          },
          { type: 'WALK', desc: 'Jalan kaki ke titik tujuan', duration: Math.round(walk2 / 75) }
        ],
        pathCoords: [fCoord, [bestO.station.lat, bestO.station.lon], [hub.lat, hub.lon], [bestD.station.lat, bestD.station.lon], tCoord]
      });
    }

    return results;
  }

  function renderItineraries(itins) {
    var container = document.getElementById('itineraries-container');
    container.innerHTML = '';

    if (itins.length === 0) {
      container.innerHTML = '<div style="padding:14px;color:#DC2626;font-size:13px;">Tidak ditemukan rute transit yang cocok.</div>';
      return;
    }

    itins.forEach(function(it, idx) {
      var card = document.createElement('div');
      card.className = 'itin-card' + (idx === 0 ? ' active' : '');

      var stripHtml = '';
      it.legs.forEach(function(leg) {
        if (leg.type === 'WALK') {
          stripHtml += '<span style="font-size:11px;color:#64748B;">🚶 ' + leg.duration + ' mnt</span>';
        } else {
          stripHtml += '<span class="strip-badge" style="background:' + leg.color + ';">' + leg.name.split(' ')[0] + '</span>';
        }
      });

      var timelineHtml = '<div class="timeline">';
      it.legs.forEach(function(leg) {
        timelineHtml += '<div class="tl-step">' +
          '<span class="strip-badge" style="background:' + (leg.color || '#64748B') + ';">' + (leg.type === 'WALK' ? 'JALAN' : leg.mode.toUpperCase()) + '</span>' +
          '<div class="tl-content">' +
            '<div>' + leg.desc + '</div>' +
            '<div class="tl-sub">' + leg.duration + ' menit</div>' +
          '</div>' +
        '</div>';
      });
      timelineHtml += '</div>';

      card.innerHTML = '<div class="itin-row-main">' +
        '<span class="itin-dur">' + it.duration_minutes + ' Menit</span>' +
        '<span class="itin-price">Rp ' + it.estimated_fare.toLocaleString('id-ID') + '</span>' +
      '</div>' +
      '<div class="itin-tags">' +
        '<span>🚶 ' + it.walking_distance + ' m jalan</span>' +
        '<span>⇄ ' + it.transfers + ' transit</span>' +
        '<span>⏱ ' + it.departure_time + ' – ' + it.arrival_time + '</span>' +
      '</div>' +
      '<div class="itin-strip">' + stripHtml + '</div>' +
      timelineHtml;

      card.onclick = function() {
        document.querySelectorAll('.itin-card').forEach(function(c) { c.classList.remove('active'); });
        card.classList.add('active');
        drawRoutePath(it.pathCoords);
      };

      container.appendChild(card);
    });

    drawRoutePath(itins[0].pathCoords);
  }

  function drawRoutePath(coords) {
    if (routeLine) { map.removeLayer(routeLine); routeLine = null; }
    if (!coords || coords.length < 2) return;

    routeLine = L.polyline(coords, {
      color: '#005BAC',
      weight: 5,
      opacity: 0.85,
      lineJoin: 'round'
    }).addTo(map);

    map.fitBounds(routeLine.getBounds(), { padding: [60, 60] });
  }

  // Background GTFS Stops Loader (8.000+ Halte Multimoda)
  window.ALL_STOPS = [];
  try {
    fetch('data/stops.json')
      .then(function(r) { return r.ok ? r.json() : []; })
      .then(function(data) {
        if (!Array.isArray(data)) return;
        window.ALL_STOPS = data.map(function(s) {
          var mode = 'brt';
          var color = '#DC2626';
          var id = s.stop_id || '';
          var name = s.stop_name_normalized || s.stop_name_original || '';
          if (id.startsWith('krl:') || name.startsWith('Stasiun ')) { mode = 'krl'; color = '#D32F2F'; }
          else if (id.startsWith('mrt:')) { mode = 'mrt'; color = '#004B87'; }
          else if (id.startsWith('lrt:')) { mode = 'lrt'; color = '#0284C7'; }
          else if (id.startsWith('JAK') || name.startsWith('JAK.')) { mode = 'mikrotrans'; color = '#0D9488'; }
          return {
            id: id,
            name: name,
            lat: s.stop_lat,
            lon: s.stop_lon,
            mode: mode,
            color: color,
            line: mode.toUpperCase()
          };
        });
      })
      .catch(function() {});
  } catch (_) {}

  window.setDestinationPreset = function(stopId) {
    var s = STATIONS_MASTER.find(function(x) { return x.id === stopId; });

    if (fromCoord) {

    }

  // Setup Autocomplete
  function setupAutocomplete(inputId, dropdownId, clearId, isOrigin) {
    var input = document.getElementById(inputId);
    var dropdown = document.getElementById(dropdownId);
    var clear = document.getElementById(clearId);

    input.addEventListener('input', function() {
      var val = input.value.trim().toLowerCase();
      if (!val) {
        dropdown.style.display = 'none';
        clear.style.display = 'none';
        if (isOrigin) fromCoord = null; else toCoord = null;
        updateMapMarkers();
        return;
      }

      clear.style.display = 'block';

      var masterMatches = STATIONS_MASTER.filter(function(s) {
        return s.name.toLowerCase().indexOf(val) !== -1 || (s.line && s.line.toLowerCase().indexOf(val) !== -1);
      });

      var extraMatches = [];
      if (window.ALL_STOPS && window.ALL_STOPS.length > 0) {
        extraMatches = window.ALL_STOPS.filter(function(s) {
          return s.name.toLowerCase().indexOf(val) !== -1;
        }).slice(0, 15);
      }

      var seen = {};
      var matches = [];
      masterMatches.forEach(function(m) { seen[m.name.toLowerCase()] = true; matches.push(m); });
      extraMatches.forEach(function(m) {
        var k = m.name.toLowerCase();
        if (!seen[k]) {
          seen[k] = true;
          matches.push(m);
        }
      });
      matches = matches.slice(0, 8);

      dropdown.innerHTML = '';
      if (matches.length === 0) {
        dropdown.style.display = 'none';
        return;
      }

      matches.forEach(function(s) {
        var row = document.createElement('div');
        row.className = 'sugg-item';
        row.innerHTML = '<div><strong>' + s.name + '</strong><br><span style="font-size:11px;color:#64748B;">' + s.line + '</span></div>' +
          '<span class="sugg-badge" style="background:' + s.color + ';">' + s.mode + '</span>';
        row.onclick = function() {
          input.value = s.name;
          dropdown.style.display = 'none';
          if (isOrigin) {
            fromCoord = [s.lat, s.lon];
            fromName = s.name;
          } else {
            toCoord = [s.lat, s.lon];
            toName = s.name;
          }
          updateMapMarkers();
          if (fromCoord && toCoord) executePlan();
        };
        dropdown.appendChild(row);
      });
      dropdown.style.display = 'block';
    });
  }

  window.clearInput = function(isOrigin) {
    if (isOrigin) {
      document.getElementById('p-from-input').value = '';
      document.getElementById('p-from-clear').style.display = 'none';
      document.getElementById('p-from-dropdown').style.display = 'none';
      fromCoord = null;
    } else {
      document.getElementById('p-to-input').value = '';
      document.getElementById('p-to-clear').style.display = 'none';
      document.getElementById('p-to-dropdown').style.display = 'none';
      toCoord = null;
    }
    updateMapMarkers();
  };

  window.swapEndpoints = function() {
    var fi = document.getElementById('p-from-input');
    var ti = document.getElementById('p-to-input');
    var tempVal = fi.value;
    fi.value = ti.value;
    ti.value = tempVal;

    var tempCoord = fromCoord;
    fromCoord = toCoord;
    toCoord = tempCoord;

    var tempName = fromName;
    fromName = toName;
    toName = tempName;

    updateMapMarkers();
    if (fromCoord && toCoord) executePlan();
  };

  window.useCurrentLocation = function() {
    if (!navigator.geolocation) {
      alert('Perangkat Anda tidak mendukung geolokasi GPS.');
      return;
    }
    navigator.geolocation.getCurrentPosition(function(pos) {
      fromCoord = [pos.coords.latitude, pos.coords.longitude];
      fromName = 'Lokasi Sekarang (GPS)';
      document.getElementById('p-from-input').value = fromName;
      document.getElementById('p-from-clear').style.display = 'block';
      updateMapMarkers();
      map.setView(fromCoord, 14);
    }, function() {
      alert('Gagal mendeteksi lokasi GPS.');
    });
  };

  window.setModeFilter = function(mode, btn) {
    currentModeFilter = mode;
    document.querySelectorAll('.pill-btn').forEach(function(b) { b.classList.remove('active'); });
    btn.classList.add('active');
    renderStationMarkers();
  };

  window.toggleSheet = function() {
    var panel = document.getElementById('app-panel');
    if (!panel) return;
    if (panel.classList.contains('state-collapsed')) {
      panel.className = 'app-sidebar state-half';
    } else if (panel.classList.contains('state-half')) {
      panel.className = 'app-sidebar state-full';
    } else {
      panel.className = 'app-sidebar state-collapsed';
    }
  };

  // Init
  window.addEventListener('DOMContentLoaded', function() {
    initMap();
    setupAutocomplete('p-from-input', 'p-from-dropdown', 'p-from-clear', true);
    setupAutocomplete('p-to-input', 'p-to-dropdown', 'p-to-clear', false);
  });
})();
</script>
</body>
</html>
