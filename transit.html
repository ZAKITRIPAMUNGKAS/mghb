<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TransJakarta Explorer — Rute & Peta Interaktif</title>
  <meta name="description" content="Peta interaktif TransJakarta — 240 rute, 8.091 halte. Data GTFS resmi PT Transportasi Jakarta via PPID. CC BY 4.0.">
  <link rel="icon" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <style>
    :root {
      --font: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --bg: #f0f2f5;
      --surface: #ffffff;
      --text: #1e293b;
      --text-secondary: #64748b;
      --text-muted: #94a3b8;
      --brand: #007C89;
      --brand-light: #e0f2f4;
      --border: #e2e8f0;
      --red: #dc2626;
      --blue: #2563eb;
      --green: #16a34a;
      --purple: #9333ea;
      --orange: #ea580c;
      --amber: #d97706;
      --radius: 12px;
      --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
      display: flex;
    }
    #app { display: flex; width: 100%; height: 100%; }

    /* ─── SIDEBAR ─── */
    #sidebar {
      width: 380px;
      min-width: 340px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      z-index: 10;
      box-shadow: var(--shadow);
    }
    .sidebar-header {
      padding: 16px 18px 12px;
      border-bottom: 1px solid var(--border);
      background: linear-gradient(135deg, var(--brand), #0A2540);
      color: #fff;
    }
    .sidebar-header h1 {
      font-size: 17px;
      font-weight: 800;
      letter-spacing: -0.3px;
    }
    .sidebar-header .sub {
      font-size: 10px;
      opacity: 0.75;
      margin-top: 2px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .sidebar-header .badge {
      display: inline-block;
      background: rgba(255,255,255,0.18);
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 10px;
    }
    .sidebar-stats {
      display: flex;
      padding: 10px 18px;
      gap: 12px;
      border-bottom: 1px solid var(--border);
      background: #f8fafc;
      overflow-x: auto;
    }
    .sidebar-stats .stat {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 600;
      white-space: nowrap;
    }
    .stat-dot {
      width: 8px;
      height: 8px;
      border-radius: 2px;
      flex-shrink: 0;
    }
    .sidebar-search {
      padding: 10px 18px;
      border-bottom: 1px solid var(--border);
    }
    .sidebar-search input {
      width: 100%;
      padding: 9px 12px 9px 36px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 13px;
      font-family: var(--font);
      background: #f8fafc;
      color: var(--text);
      outline: none;
      transition: border 0.15s, box-shadow 0.15s;
    }
    .sidebar-search input:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(0,124,137,0.1);
    }
    .sidebar-search {
      position: relative;
    }
    .sidebar-search svg {
      position: absolute;
      left: 28px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
    }
    #route-list {
      flex: 1;
      overflow-y: auto;
    }
    #route-list::-webkit-scrollbar { width: 5px; }
    #route-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }
    .route-row {
      display: flex;
      align-items: center;
      padding: 9px 18px;
      gap: 10px;
      cursor: pointer;
      transition: background 0.1s;
      border-bottom: 1px solid #f1f5f9;
      font-size: 13px;
    }
    .route-row:hover { background: #f8fafc; }
    .route-row.active { background: var(--brand-light); border-left: 3px solid var(--brand); padding-left: 15px; }
    .route-row .rid {
      font-weight: 700;
      font-size: 14px;
      min-width: 38px;
      color: var(--text);
    }
    .route-row .rname {
      flex: 1;
      font-size: 12px;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .route-row .rcat {
      font-size: 10px;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 5px;
      white-space: nowrap;
      background: #f1f5f9;
    }
    .route-row .rcat.BRT { background: #fef2f2; color: var(--red); }
    .route-row .rcat.Metrotrans { background: #eff6ff; color: var(--blue); }
    .route-row .rcat.Mikrotrans { background: #f0fdf4; color: var(--green); }
    .route-row .rcat.Royaltrans { background: #faf5ff; color: var(--purple); }
    .route-row .rcat.Transjabodetabek { background: #fff7ed; color: var(--orange); }
    .route-row .rcat.Bus-Wisata { background: #fffbeb; color: var(--amber); }
    .route-empty {
      padding: 32px;
      text-align: center;
      color: var(--text-muted);
      font-size: 13px;
    }

    /* ─── MAIN MAP AREA ─── */
    #main-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
    }
    #map-container {
      flex: 1;
      position: relative;
    }
    #map { width: 100%; height: 100%; }
    #detail-panel {
      position: absolute;
      bottom: 16px;
      left: 16px;
      right: 16px;
      max-height: 38vh;
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: 0 8px 32px rgba(0,0,0,0.15);
      overflow: hidden;
      display: none;
      z-index: 1000;
      border: 1px solid var(--border);
    }
    #detail-panel.show { display: flex; flex-direction: column; }
    .detail-header {
      padding: 14px 18px;
      background: linear-gradient(135deg, var(--brand), #0A2540);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .detail-header h2 { font-size: 20px; font-weight: 800; }
    .detail-header .dcat { font-size: 11px; opacity: 0.8; margin-left: 8px; }
    .detail-header .dname { font-size: 12px; opacity: 0.65; margin-top: 1px; }
    .detail-close {
      background: rgba(255,255,255,0.15);
      border: none;
      color: #fff;
      font-size: 18px;
      cursor: pointer;
      width: 28px;
      height: 28px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font);
    }
    .detail-body {
      display: flex;
      overflow-x: auto;
      flex: 1;
    }
    .direction-col {
      min-width: 260px;
      flex: 1;
      padding: 10px 14px;
      border-right: 1px solid var(--border);
      overflow-y: auto;
      max-height: 30vh;
    }
    .direction-col:last-child { border-right: none; }
    .direction-title {
      font-size: 12px;
      font-weight: 700;
      color: var(--brand);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .direction-title .dir-icon {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--brand);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: 800;
    }
    .stop-item {
      display: flex;
      align-items: flex-start;
      padding: 3px 0;
      cursor: pointer;
      font-size: 11px;
    }
    .stop-item:hover { opacity: 0.8; }
    .stop-seq {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      color: #fff;
      font-size: 9px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-right: 8px;
    }
    .stop-seq.first { background: var(--green); }
    .stop-seq.last { background: var(--red); }
    .stop-seq.mid { background: var(--brand); }
    .stop-name { font-weight: 600; color: var(--text); }
    .stop-id { color: var(--text-muted); font-size: 9px; }
    .stop-connector {
      width: 1.5px;
      height: 10px;
      background: var(--border);
      margin-left: 9px;
    }

    /* ─── LOADING ─── */
    #loading {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--surface);
      z-index: 9999;
      transition: opacity 0.3s;
    }
    #loading.hidden { opacity: 0; pointer-events: none; }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid var(--border);
      border-top-color: var(--brand);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { margin-top: 12px; font-size: 13px; color: var(--text-secondary); font-weight: 500; }

    /* ─── MOBILE ─── */
    @media (max-width: 768px) {
      #sidebar { width: 100%; min-width: 0; max-height: 45vh; }
      #app { flex-direction: column; }
      #detail-panel { bottom: 8px; left: 8px; right: 8px; max-height: 50vh; }
      .detail-body { flex-direction: column; }
      .direction-col { max-height: none; border-right: none; border-bottom: 1px solid var(--border); }
    }

    /* ─── DARK MODE ─── */
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f172a;
        --surface: #1e293b;
        --text: #f1f5f9;
        --text-secondary: #94a3b8;
        --text-muted: #64748b;
        --border: #334155;
        --shadow: 0 1px 3px rgba(0,0,0,0.3);
      }
      .sidebar-stats { background: #1a2332; }
      .sidebar-search input { background: #1a2332; }
      .route-row:hover { background: #1a2332; }
      .route-row.active { background: rgba(0,124,137,0.15); }
      .route-row .rcat { background: #334155; }
      .route-row .rcat.BRT { background: rgba(220,38,38,0.15); }
      .route-row .rcat.Metrotrans { background: rgba(37,99,235,0.15); }
      .route-row .rcat.Mikrotrans { background: rgba(22,163,74,0.15); }
      .route-row .rcat.Royaltrans { background: rgba(147,51,234,0.15); }
      .route-row .rcat.Transjabodetabek { background: rgba(234,88,12,0.15); }
      .route-row .rcat.Bus-Wisata { background: rgba(217,119,6,0.15); }
    }
  </style>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="sidebar-header">
      <h1>TransJakarta Explorer</h1>
      <div class="sub">
        <span class="badge">GTFS · PPID · CC BY 4.0</span>
        <span id="route-count-label">— rute</span>
      </div>
    </div>
    <div class="sidebar-stats" id="sidebar-stats"></div>
    <div class="sidebar-search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="search-input" placeholder="Cari rute (nama / kode)...">
    </div>
    <div id="route-list"></div>
  </aside>
  <div id="main-area">
    <div id="loading">
      <div class="spinner"></div>
      <div class="loading-text">Memuat 240 rute TransJakarta...</div>
    </div>
    <div id="map-container">
      <div id="map"></div>
    </div>
    <div id="detail-panel">
      <div class="detail-header">
        <div>
          <h2 id="detail-rid"></h2>
          <span class="dcat" id="detail-cat"></span>
          <div class="dname" id="detail-name"></div>
        </div>
        <button class="detail-close" onclick="closeDetail()">✕</button>
      </div>
      <div class="detail-body" id="detail-stops"></div>
    </div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
(function() {
  var CAT_COLORS = {
    BRT: '#dc2626', Metrotrans: '#2563eb', Mikrotrans: '#16a34a',
    Royaltrans: '#9333ea', Transjabodetabek: '#ea580c', 'Bus Wisata': '#d97706'
  };
  var CAT_BG = {
    BRT: 'rgba(220,38,38,0.12)', Metrotrans: 'rgba(37,99,235,0.12)', Mikrotrans: 'rgba(22,163,74,0.12)',
    Royaltrans: 'rgba(147,51,234,0.12)', Transjabodetabek: 'rgba(234,88,12,0.12)', 'Bus Wisata': 'rgba(217,119,6,0.12)'
  };

  var routes = [], routeDetails = [], geoData = {};
  var map, activeLayer, activeMarkers = [], popupMarker;

  function init() {
    var list = document.getElementById('route-list');
    list.innerHTML = '<div class="route-empty"><div class="spinner" style="margin:0 auto 12px;"></div>Memuat...</div>';

    Promise.all([
      fetch('data/routes.json').then(function(r){ return r.json(); }).catch(function(){ return []; }),
      fetch('data/route_details.json').then(function(r){ return r.json(); }).catch(function(){ return []; }),
      fetch('data/route_geometries.json').then(function(r){ return r.json(); }).catch(function(){ return {}; })
    ]).then(function(results) {
      routes = results[0];
      routeDetails = results[1];
      geoData = results[2];

      document.getElementById('route-count-label').textContent = routes.length + ' Rute · 8.091 Halte';
      renderStats();
      renderRouteList();
      initMap();
      document.getElementById('loading').classList.add('hidden');
    }).catch(function(e) {
      list.innerHTML = '<div class="route-empty">Gagal memuat data. Pastikan file JSON di folder data/ tersedia.<br><br>' + e.message + '</div>';
    });
  }

  function renderStats() {
    var cats = {};
    routes.forEach(function(r) {
      var c = r.route_category || 'Unknown';
      cats[c] = (cats[c] || 0) + 1;
    });
    var html = '';
    var keys = ['BRT', 'Metrotrans', 'Mikrotrans', 'Royaltrans', 'Transjabodetabek', 'Bus Wisata', 'Unknown'];
    keys.forEach(function(k) {
      if (cats[k]) {
        html += '<div class="stat"><span class="stat-dot" style="background:'+(CAT_COLORS[k]||'#94a3b8')+';"></span>'+k+' <b>'+cats[k]+'</b></div>';
      }
    });
    document.getElementById('sidebar-stats').innerHTML = html;
  }

  function renderRouteList(filter) {
    var q = (filter || '').toLowerCase();
    var list = document.getElementById('route-list');
    var filtered = routes.filter(function(r) {
      if (!q) return true;
      return (r.route_id||'').toLowerCase().indexOf(q) >= 0 ||
             (r.route_long_name||'').toLowerCase().indexOf(q) >= 0 ||
             (r.route_desc||'').toLowerCase().indexOf(q) >= 0 ||
             (r.route_category||'').toLowerCase().indexOf(q) >= 0;
    }).sort(function(a, b) {
      return (a.route_id||'').localeCompare(b.route_id||'');
    });

    if (!filtered.length) {
      list.innerHTML = '<div class="route-empty">Tidak ada rute ditemukan</div>';
      return;
    }
    list.innerHTML = filtered.map(function(r) {
      var cat = r.route_category || 'Other';
      return '<div class="route-row" data-rid="'+r.route_id+'" onclick="selectRoute(\''+r.route_id+'\')">' +
        '<span class="rid">'+r.route_id+'</span>' +
        '<span class="rname">'+(r.route_long_name && r.route_long_name !== r.route_id ? r.route_long_name : (r.route_desc || ''))+'</span>' +
        '<span class="rcat '+cat.replace(/\s/g,'-')+'">'+cat+'</span>' +
      '</div>';
    }).join('');

    if (window._activeRid) {
      var activeEl = list.querySelector('[data-rid="'+window._activeRid+'"]');
      if (activeEl) activeEl.classList.add('active');
    }
  }

  document.getElementById('search-input').addEventListener('input', function() {
    renderRouteList(this.value);
  });

  function selectRoute(rid) {
    window._activeRid = rid;
    document.querySelectorAll('.route-row').forEach(function(el) { el.classList.remove('active'); });
    var el = document.querySelector('.route-row[data-rid="'+rid+'"]');
    if (el) el.classList.add('active');

    highlightRoute(rid);
    showDetail(rid);
  }

  function initMap() {
    map = L.map('map', { zoomControl: true, attributionControl: true }).setView([-6.208, 106.845], 12);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors | Data: PPID PT Transportasi Jakarta CC BY 4.0',
      maxZoom: 19
    }).addTo(map);
    // Force tile load after render
    setTimeout(function(){ map.invalidateSize(); }, 300);
  }

  function highlightRoute(rid) {
    if (activeLayer) { map.removeLayer(activeLayer); activeLayer = null; }
    activeMarkers.forEach(function(m) { map.removeLayer(m); });
    activeMarkers = [];
    if (popupMarker) { map.removeLayer(popupMarker); popupMarker = null; }

    var features = geoData[rid];
    if (!features || !features.length) return;

    var routeMeta = routes.find(function(r) { return r.route_id === rid; }) || {};
    var color = CAT_COLORS[routeMeta.route_category] || '#007C89';

    var group = L.featureGroup();
    features.forEach(function(f) {
      var latlngs = f.geometry.coordinates.map(function(c) { return [c[1], c[0]]; });
      if (latlngs.length >= 2) {
        L.polyline(latlngs, {
          color: color, weight: 4, opacity: 0.9,
          lineCap: 'round', lineJoin: 'round'
        }).addTo(group);
      }
    });
    group.addTo(map);
    activeLayer = group;
    try { map.fitBounds(group.getBounds().pad(0.08)); } catch(e) {}
  }

  function showDetail(rid) {
    var rd = routeDetails.find(function(d) { return d.route_id === rid; });
    if (!rd) { closeDetail(); return; }
    var routeMeta = routes.find(function(r) { return r.route_id === rid; }) || {};

    document.getElementById('detail-rid').textContent = rid;
    document.getElementById('detail-cat').textContent = routeMeta.route_category || '';
    document.getElementById('detail-name').textContent = (routeMeta.route_long_name && routeMeta.route_long_name !== rid) ? routeMeta.route_long_name : (routeMeta.route_desc || '');

    var stopsHTML = rd.directions.map(function(d) {
      var stops = d.stops.map(function(s, i) {
        var cls = i === 0 ? 'first' : (i === d.stops.length - 1 ? 'last' : 'mid');
        return '<div class="stop-item" onclick="flyToStop('+s.lat+','+s.lon+',\''+(s.name||s.stop_id).replace(/'/g,"\\'")+'\')">' +
          '<div style="display:flex;flex-direction:column;align-items:center;margin-right:8px;">' +
            '<div class="stop-seq '+cls+'">'+(i+1)+'</div>' +
            (i < d.stops.length - 1 ? '<div class="stop-connector"></div>' : '') +
          '</div>' +
          '<div>' +
            '<div class="stop-name">'+s.name+'</div>' +
            '<div class="stop-id">'+s.stop_id+' · '+s.lat.toFixed(4)+', '+s.lon.toFixed(4)+'</div>' +
          '</div>' +
        '</div>';
      }).join('');
      return '<div class="direction-col">' +
        '<div class="direction-title"><span class="dir-icon">'+(d.direction_id===0?'A':'B')+'</span> '+d.headsign+' <span style="font-size:10px;opacity:.7;">('+d.stop_count+' halte)</span></div>' +
        stops +
      '</div>';
    }).join('');

    document.getElementById('detail-stops').innerHTML = stopsHTML;
    document.getElementById('detail-panel').classList.add('show');
  }

  function closeDetail() {
    document.getElementById('detail-panel').classList.remove('show');
    window._activeRid = null;
    document.querySelectorAll('.route-row').forEach(function(el) { el.classList.remove('active'); });
    if (activeLayer) { map.removeLayer(activeLayer); activeLayer = null; }
  }

  window.flyToStop = function(lat, lon, name) {
    if (!map) return;
    if (popupMarker) map.removeLayer(popupMarker);
    var marker = L.marker([lat, lon], {
      icon: L.divIcon({
        className: '',
        html: '<div style="width:16px;height:16px;border-radius:50%;background:#007C89;border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.35);"></div>',
        iconSize: [16,16], iconAnchor: [8,8]
      })
    }).addTo(map).bindPopup('<b>'+name+'</b><br><span style="font-size:10px;">'+lat.toFixed(5)+', '+lon.toFixed(5)+'</span>', {closeButton:true}).openPopup();
    popupMarker = marker;
    map.setView([lat, lon], Math.max(map.getZoom(), 15), { animate: true, duration: 0.5 });
  };

  window.closeDetail = closeDetail;
  window.selectRoute = selectRoute;

  document.addEventListener('DOMContentLoaded', init);
})();
</script>
</body>
</html>
