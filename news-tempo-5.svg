<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF7ED"/>
      <stop offset="50%" stop-color="#FFEDD5"/>
      <stop offset="100%" stop-color="#FED7AA"/>
    </linearGradient>
    <linearGradient id="screenGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A2540"/>
      <stop offset="100%" stop-color="#004D56"/>
    </linearGradient>
    <linearGradient id="chartBar" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#007C89"/>
      <stop offset="100%" stop-color="#14B8A6"/>
    </linearGradient>
    <linearGradient id="chartBarOrange" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#EA580C"/>
      <stop offset="100%" stop-color="#F97316"/>
    </linearGradient>
    <pattern id="gridGraph" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#F97316" stroke-width="0.75" opacity="0.12"/>
    </pattern>
  </defs>

  <rect width="640" height="360" fill="url(#bg5)"/>
  <rect width="640" height="360" fill="url(#gridGraph)"/>

  <!-- Big Interactive Dashboard Screen (SSE Command Center Monitor) -->
  <g id="screen-dashboard" transform="translate(180, 40)">
    <!-- Monitor Stand & Shadow -->
    <ellipse cx="140" cy="245" rx="80" ry="12" fill="#0F172A" opacity="0.2"/>
    <path d="M 125 210 L 115 240 L 165 240 L 155 210 Z" fill="#475569" stroke="#0F172A" stroke-width="3"/>
    
    <!-- Monitor Bezel -->
    <rect x="0" y="0" width="280" height="210" rx="10" fill="#1E293B" stroke="#0F172A" stroke-width="4"/>
    <!-- Screen Display Area -->
    <rect x="10" y="10" width="260" height="190" rx="6" fill="url(#screenGlow)"/>

    <!-- Screen Header -->
    <rect x="18" y="18" width="90" height="14" rx="3" fill="#007C89"/>
    <text x="63" y="28" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="7" fill="#FFFFFF" text-anchor="middle">PORTAL MONITORING</text>
    <circle cx="245" cy="24" r="4" fill="#10B981"/>
    <text x="235" y="27" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="6" fill="#10B981" text-anchor="end">LIVE NASIONAL</text>

    <!-- Bar Chart Visual inside screen -->
    <g transform="translate(25, 60)">
      <rect x="10" y="70" width="18" height="45" rx="2" fill="url(#chartBar)"/>
      <rect x="36" y="50" width="18" height="65" rx="2" fill="url(#chartBar)"/>
      <rect x="62" y="30" width="18" height="85" rx="2" fill="url(#chartBarOrange)"/>
      <rect x="88" y="45" width="18" height="70" rx="2" fill="url(#chartBar)"/>
      <rect x="114" y="20" width="18" height="95" rx="2" fill="url(#chartBarOrange)"/>
      <rect x="140" y="10" width="18" height="105" rx="2" fill="url(#chartBar)"/>
      <!-- Trendline Line chart -->
      <polyline points="19,65 45,45 71,25 97,40 123,15 149,5" fill="none" stroke="#FDE047" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="149" cy="5" r="4" fill="#F15A24" stroke="#FFFFFF" stroke-width="1.5"/>
    </g>

    <!-- Mini Funnel / Donut on screen right -->
    <g transform="translate(195, 80)">
      <circle cx="35" cy="35" r="28" fill="none" stroke="#F15A24" stroke-width="7" stroke-dasharray="120 40"/>
      <circle cx="35" cy="35" r="28" fill="none" stroke="#007C89" stroke-width="7" stroke-dasharray="40 120"/>
      <text x="35" y="38" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="9" fill="#FFFFFF" text-anchor="middle">+34%</text>
      <text x="35" y="75" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="6.5" fill="#E2E8F0" text-anchor="middle">KUOTA MAGANG</text>
    </g>
  </g>

  <!-- Character: Analis Data Muda BNI (Tempo Caricature Style) -->
  <g id="karikatur-analis" transform="translate(30, 110)">
    <!-- Shadow -->
    <ellipse cx="65" cy="210" rx="45" ry="10" fill="#0F172A" opacity="0.22"/>

    <!-- Chair Back -->
    <rect x="25" y="70" width="14" height="110" rx="4" fill="#0F172A"/>

    <!-- Body / Blazer Kantor Navy BNI -->
    <path d="M 40 90 L 95 90 L 105 185 L 35 185 Z" fill="#0F766E" stroke="#0F172A" stroke-width="3"/>
    <!-- Lapels (Kerah Blazer) -->
    <polygon points="50,90 68,135 60,135 45,90" fill="#004D56" stroke="#0F172A" stroke-width="1.8"/>
    <polygon points="85,90 68,135 76,135 90,90" fill="#004D56" stroke="#0F172A" stroke-width="1.8"/>
    <!-- Kemeja Putih dalaman & Dasi Oranye BNI -->
    <polygon points="60,90 75,90 68,125" fill="#FFFFFF"/>
    <polygon points="65,100 71,100 73,150 67,156 63,150" fill="#F15A24" stroke="#0F172A" stroke-width="1.5"/>

    <!-- Head & Expression (Focus & Visionary Tempo Editorial) -->
    <ellipse cx="70" cy="55" rx="26" ry="28" fill="#FDBA74" stroke="#0F172A" stroke-width="3"/>
    <!-- Glasses (Kacamata Analis) -->
    <rect x="52" y="48" width="16" height="13" rx="3" fill="#FFFFFF" fill-opacity="0.8" stroke="#0F172A" stroke-width="2.2"/>
    <rect x="72" y="48" width="16" height="13" rx="3" fill="#FFFFFF" fill-opacity="0.8" stroke="#0F172A" stroke-width="2.2"/>
    <line x1="68" y1="54" x2="72" y2="54" stroke="#0F172A" stroke-width="2"/>
    <!-- Focus Eyes -->
    <circle cx="60" cy="54" r="2.8" fill="#0F172A"/>
    <circle cx="80" cy="54" r="2.8" fill="#0F172A"/>
    <!-- Confident Smile -->
    <path d="M 62 70 Q 70 78 78 70" fill="none" stroke="#0F172A" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Hair (Smart Office Look) -->
    <path d="M 45 48 C 42 22 65 20 85 22 C 96 24 100 35 95 50 C 90 38 82 32 68 32 C 55 32 48 40 45 48 Z" fill="#0F172A"/>

    <!-- Arm Typing on Keyboard -->
    <path d="M 90 115 Q 120 125 140 145" fill="none" stroke="#0F172A" stroke-width="6" stroke-linecap="round"/>
    <circle cx="140" cy="147" r="7" fill="#FDBA74" stroke="#0F172A" stroke-width="2"/>
  </g>

  <!-- Laptop on Desk with Coffee Mug (Atmosphere of Menara BNI) -->
  <g transform="translate(130, 240)">
    <!-- Desk Surface (Dark Wood) -->
    <rect x="-30" y="15" width="400" height="15" fill="#334155" stroke="#0F172A" stroke-width="2.5"/>
    <!-- Keyboard Base -->
    <polygon points="15,0 75,0 85,15 5,15" fill="#CBD5E1" stroke="#0F172A" stroke-width="2"/>
    
    <!-- Hot Coffee Mug (Kopi Pejompongan) -->
    <g transform="translate(100, -8)">
      <rect x="0" y="0" width="18" height="23" rx="3" fill="#FFFFFF" stroke="#0F172A" stroke-width="2"/>
      <path d="M 18 5 C 25 5 25 15 18 15" fill="none" stroke="#0F172A" stroke-width="2"/>
      <rect x="3" y="6" width="12" height="10" rx="1" fill="#007C89"/>
      <!-- Steam -->
      <path d="M 5 -4 Q 8 -10 5 -16" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M 12 -4 Q 15 -10 12 -16" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Editorial Ribbon "INOVASI DIGITAL PERBANKAN" -->
  <g transform="translate(450, 240) rotate(-6)">
    <rect x="0" y="0" width="165" height="42" rx="6" fill="#F15A24" stroke="#0F172A" stroke-width="2.8"/>
    <text x="82" y="18" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="10.5" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">DIGITALISASI</text>
    <text x="82" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="7.5" fill="#FDE68A" text-anchor="middle" letter-spacing="0.5">DUNIA USAHA &amp; INDUSTRI</text>
  </g>

  <!-- Ground Line -->
  <line x1="0" y1="320" x2="640" y2="320" stroke="#0F172A" stroke-width="4"/>
  <rect x="0" y="320" width="640" height="40" fill="#F8FAFC"/>

  <!-- Caption Strip ala Tempo -->
  <rect x="25" y="327" width="240" height="24" rx="3" fill="#0F172A"/>
  <text x="145" y="343" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="9" fill="#FED7AA" text-anchor="middle" letter-spacing="0.5">DIGITALISASI PROGRAM PEMAGANGAN</text>
</svg>
